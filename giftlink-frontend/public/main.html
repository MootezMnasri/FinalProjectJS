<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GiftLink - Home</title>
  <link rel="stylesheet" href="css/home.css" />
  <style>
    .gl-main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
    .gl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .gl-card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
    .gl-image { width: 100%; height: 140px; object-fit: cover; }
    .gl-content { padding: 0.75rem; }
    .gl-title { font-size: 1.1rem; margin: 0 0 0.5rem; }
    .gl-desc { color: #555; font-size: 0.9rem; }
    .gl-meta { color: #777; font-size: 0.8rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <header class="header"></header>
  <main id="root"></main>
  <footer class="footer"></footer>

  <script type="module">
    import { renderNavbar } from './js/Navbar.js';
    import { renderMainPage } from './js/MainPage.js';
    // Render simple navbar
    const header = document.querySelector('.header');
    renderNavbar(header);
    // Render main content
    const root = document.getElementById('root');
    renderMainPage(root);
  </script>
</body>
</html>
