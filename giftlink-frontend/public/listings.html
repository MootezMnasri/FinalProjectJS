<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listings - GiftLink</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <h1><a href="home.html">GiftLink</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="listings.html" class="active">Listings</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="listings-header">
            <h2>Browse Listings</h2>
            <p>Find free items in your area</p>
        </section>

        <section class="search-section">
            <form class="search-form">
                <input type="text" id="searchInput" placeholder="Search items...">
                <select id="categorySelect">
                    <option value="">All Categories</option>
                    <option value="furniture">Furniture</option>
                    <option value="electronics">Electronics</option>
                    <option value="kitchen">Kitchen</option>
                    <option value="books">Books</option>
                    <option value="baby">Baby</option>
                    <option value="home">Home</option>
                </select>
                <input type="text" id="locationInput" placeholder="Location">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </section>

        <section class="listings-grid" id="listingsContainer">
            <p class="loading">Loading listings...</p>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 GiftLink. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function fetchGifts() {
            try {
                const response = await fetch(`${API_URL}/gifts`);
                const gifts = await response.json();
                displayGifts(gifts);
            } catch (error) {
                console.error('Error fetching gifts:', error);
                document.getElementById('listingsContainer').innerHTML = 
                    '<p class="error">Unable to load listings. Please try again later.</p>';
            }
        }

        function displayGifts(gifts) {
            const container = document.getElementById('listingsContainer');
            if (!gifts || gifts.length === 0) {
                container.innerHTML = '<p class="no-results">No listings found.</p>';
                return;
            }

            container.innerHTML = gifts.map(gift => `
                <div class="listing-card">
                    <div class="listing-image">
                        <img src="${gift.image || 'https://via.placeholder.com/300x200'}" alt="${gift.title}">
                    </div>
                    <div class="listing-info">
                        <h3>${gift.title}</h3>
                        <p class="listing-category">${gift.category}</p>
                        <p class="listing-description">${gift.description}</p>
                        <p class="listing-location">📍 ${gift.location}</p>
                        <p class="listing-condition">Condition: ${gift.condition}</p>
                        <a href="details.html?id=${gift._id}" class="btn btn-secondary">View Details</a>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', fetchGifts);
    </script>
</body>
</html>
